name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every check runs in the compose dev stack, the digest-pinned image the devcontainer and the
# pre-push hook use.
env:
  DEV: docker compose -f compose.dev.yml run --rm -T

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pxm-0/haruspex
          path: haruspex
      - name: Build the dev image
        run: docker compose -f compose.dev.yml build dev
      - name: Format
        run: $DEV dev cargo fmt --all --check
      - name: Clippy
        run: $DEV dev cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: wg-factory builds without std
        run: $DEV dev cargo build -p wg-factory --locked --target thumbv7em-none-eabihf
      - name: Tests (finalize against the real Haruspex CLI)
        run: $DEV -e HARUSPEX_CLI=/workspace/haruspex/scripts/haruspex.py dev cargo test --workspace --locked
      - name: Coverage of wg, at least 80% of lines
        run: $DEV -e HARUSPEX_CLI=/workspace/haruspex/scripts/haruspex.py dev cargo llvm-cov -p wg --locked --fail-under-lines 80
      - name: File size
        run: $DEV dev cargo xtask size
      - name: Workflow control-flow tests
        run: $DEV dev sh -c 'node --test tests/*.test.mjs'
