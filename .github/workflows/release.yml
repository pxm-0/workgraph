name: release

# A `v*` tag builds the matrix and attaches each binary to a new release. A push to main builds the
# same matrix and keeps each binary as an artifact with its sha256 and head SHA, which is what
# `wg self install --sha` downloads and verifies (design §12.5): nothing is built on the Mac. A
# pull request that touches the build runs the matrix without publishing.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - "wg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  create:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    # On a pull request `create` is skipped; build anyway, but never after it failed.
    if: ${{ !cancelled() && needs.create.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain CI tests with (rust-toolchain.toml), plus the matrix target.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p wg --target ${{ matrix.target }}
      # A pull request keeps its binaries as a short-lived artifact, so real runs of a branch use
      # exactly what CI built (no cargo on the owner's Mac).
      - name: Keep the binary (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wg
          retention-days: 7
      - name: Keep the binary, its sha256 and head SHA (main)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir install
          cp "target/${{ matrix.target }}/release/wg" install/wg
          (cd install && shasum -a 256 wg > wg.sha256)
          echo "${{ github.sha }}" > install/head_sha
      - name: Upload the install artifact (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wg-${{ matrix.target }}
          path: install/
          retention-days: 90
      - name: Upload binary and checksum
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/${{ matrix.target }}/release/wg" "wg-${{ matrix.target }}"
          shasum -a 256 "wg-${{ matrix.target }}" > "wg-${{ matrix.target }}.sha256"
          gh release upload "$GITHUB_REF_NAME" "wg-${{ matrix.target }}" "wg-${{ matrix.target }}.sha256"
