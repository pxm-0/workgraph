name: release

# A `v*` tag builds the matrix and attaches each binary to a new release. A pull request that
# touches the build runs the same matrix without publishing, so the release assets are proven to
# build before merge.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "wg/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  create:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    # On a pull request `create` is skipped; build anyway, but never after it failed.
    if: ${{ !cancelled() && needs.create.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain CI tests with (rust-toolchain.toml), plus the matrix target.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p wg --target ${{ matrix.target }}
      - name: Upload binary and checksum
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/${{ matrix.target }}/release/wg" "wg-${{ matrix.target }}"
          shasum -a 256 "wg-${{ matrix.target }}" > "wg-${{ matrix.target }}.sha256"
          gh release upload "$GITHUB_REF_NAME" "wg-${{ matrix.target }}" "wg-${{ matrix.target }}.sha256"
