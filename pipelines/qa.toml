# The QA pipeline (design §6.2, Phase 4): runs in the task worktree after dev, in the same run. Every
# QA fix goes through the build fix loop, so a re-review follows before publish (§6.3 invariant 3).
[pipeline]
name = "qa"

[[stage]]
id = "regression"
kind = "checks"
set = "qa"                   # the gate plus factory.toml [[repo]].qa_checks, e.g. the e2e suite
on_fail = "fix"              # blamed units, one round, then stop
max_fix_rounds = 1

[[stage]]
id = "explore"
kind = "agent"
role = "qa-explorer"
model = "sonnet"
effort = "high"
prompt = "qa-explore"        # negative and recovery paths, throwaway scripts in <run>/tmp only
schema = "verdict"           # {passed, findings[{id, severity, file, summary}]}
gate = { field = "passed", equals = true }
on_fail = "fix"              # blamed findings, one round, recheck, run explore again
max_turns = 60
timeout_secs = 1200

[[stage]]                    # required: a QA fix changes the tree after dev's review. No call is
id = "re-review"             # made when no QA fix changed anything since that review.
kind = "review"
model = "opus"
prompt = "review"
max_fix_rounds = 1
max_turns = 60
timeout_secs = 1800

[[stage]]
id = "publish"
kind = "publish"
draft = true
labels = ["wg:awaiting-approval"]
