[package]
name = "wg"
version = "0.3.0"
edition = "2021"
description = "Deterministic I/O for the workgraph plugin: recall, check, save, finalize"
publish = false
# Test targets are listed below so cli.rs can be compiled through a wrapper (see tests/cli_target.rs).
autotests = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "cli"
path = "tests/cli_target.rs"

[[test]]
name = "legacy_args"
path = "tests/legacy_args.rs"
